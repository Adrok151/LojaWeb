<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../static/style.css">
    <title>Lista de Usuários</title>
</head>
<body>
    <form action="{{ url_for('menu') }}">
        <button>Voltar</button>
    </form>
    <form action="{{ url_for('carrinho.carrinho') }}">
        <button>Carrinho</button>
    </form>

    <div class="card">
        <img src="{{ url_for('static', filename=produto.imagem) }}"
            alt="{{ produto.nome }}">
        <div class="card-body">
            <h2>{{ produto.nome }}</h2> 
            <p class="categoria">{{ produto.categoria }}</p>
            <p class="descricao">{{ produto.descricao }}</p>
            <p class="preco">R$ {{ "%.2f"|format(produto.preco) }}</p>
            <button onclick="addCarrinho({{ produto.id }})">
                Adicionar ao carrinho
            </button>
        </div>
    </div>
</body>
<script>
    function addCarrinho(id) {
        fetch('/carrinho/addCarrinho', {
            method: 'POST',
            body: JSON.stringify({ id: id }),
            headers: {
                'Content-Type': 'application/json'
            }
            })
            .then(res => res.json())
            .then(data => {
            if (data.success) {
                alert("Produto adicionado!");
            } else {
                alert("Erro ao adicionar");
            }
            })
            .catch(err => {
            console.error(err);
            alert("Erro na requisição");
            });
    }
</script>
</html>
